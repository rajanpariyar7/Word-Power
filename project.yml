name: WordPower
options:
  bundleIdPrefix: com.wordpower
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
settings:
  base:
    PRODUCT_NAME: WordPower
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: 4.0.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
targets:
  WordPower:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: WordPowerApp.swift
      - path: Models
      - path: ViewModels
      - path: Views
      - path: Resources
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.wordpower
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
